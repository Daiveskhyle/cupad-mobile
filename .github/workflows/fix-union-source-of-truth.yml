name: Fix Union Source Of Truth
on:
  push:
    paths:
      - '.github/workflows/fix-union-source-of-truth.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch union handling
        shell: python
        run: |
          from pathlib import Path

          def replace_first(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  print(f'SKIP: anchor not found in {path}: {old[:100]}')
                  return False
              ns = s.replace(old, new, 1)
              if ns != s:
                  p.write_text(ns)
                  print(f'PATCHED: {path}')
                  return True
              return False

          exact_union = "c.union===null||c.union===undefined||c.union===''?'Unassigned':String(c.union)"

          replace_first(
              'app/co/combined.tsx',
              "String(c.union||'').trim()||'Unassigned'",
              exact_union
          )
          replace_first(
              'app/co/combined.tsx',
              "(String(c.union||'').trim()||'Unassigned')===u",
              f'({exact_union})===u'
          )

          replace_first(
              'app/co/savings.tsx',
              "String(c.union || '').trim() || 'Unassigned'",
              exact_union
          )
          replace_first(
              'app/co/savings.tsx',
              "(String(c.union || '').trim() || 'Unassigned') === activeUnion",
              f'({exact_union}) === activeUnion'
          )
          replace_first(
              'app/co/savings.tsx',
              "String(c.union||'').trim()||'Unassigned'",
              exact_union
          )
          replace_first(
              'app/co/savings.tsx',
              "(String(c.union||'').trim()||'Unassigned')===activeUnion",
              f'({exact_union})===activeUnion'
          )

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/co/combined.tsx app/co/savings.tsx
          if git diff --cached --quiet; then
            echo "No union changes were required."
          else
            git commit -m "fix: preserve exact PHP union assignments"
            git push
          fi
