name: Hide unnecessary installment buttons

on:
  push:
    paths:
      - '.github/workflows/hide-unnecessary-installment-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch installment button rendering
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/co/combined.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # Never render more than two installment buttons. The API/settings value
          # remains the source of truth, while the UI also hard-caps the visible
          # choices to 2 so stale/default settings cannot expose a third button.
          s = s.replace(
              '.slice(0,5).map(n=>',
              '.slice(0,Math.min(2,Math.max(0,max-min+1))).map(n=>'
          )
          s = s.replace(
              '.slice(0, 5).map(n =>',
              '.slice(0, Math.min(2, Math.max(0, max - min + 1))).map(n =>'
          )

          # Also make any Array.from installment range use the effective API max.
          s = re.sub(
              r'Array\.from\(\{length:Math\.max\(0,max-min\+1\)\},\(_?,idx\)=>min\+idx\)',
              'Array.from({length:Math.max(0,Math.min(2,max-min+1))},(_,idx)=>min+idx)',
              s
          )
          s = re.sub(
              r'Array\.from\(\{length:Math\.max\(0,max - min \+ 1\)\},\(_?,idx\) => min \+ idx\)',
              'Array.from({ length: Math.max(0, Math.min(2, max - min + 1)) }, (_, idx) => min + idx)',
              s
          )

          if s == original:
              raise SystemExit('No installment-button pattern matched; aborting without changing the app.')

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/co/combined.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: hide installment buttons beyond API max'
          git push
