name: Fix Union Loading

on:
  push:
    paths:
      - '.github/workflows/fix-union-loading.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch Combined and Savings union loading
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'app/co/combined.tsx': (
                  "const loadUnions=useCallback(async()=>{setLoading(true);try{const r=await api.getClients({limit:100,offset:0});const a=(r.data||[]).filter((c:any)=>String(c.status||'').toLowerCase()==='active');",
                  "const loadUnions=useCallback(async()=>{setLoading(true);try{const a=await api.getAllClients();"
              ),
              'app/co/savings.tsx': (
                  "const r = await api.getClients({ limit: 100, offset: 0 });\n      const active = (r.data || []).filter((c: any) => String(c.status || '').toLowerCase() === 'active');",
                  "const active = await api.getAllClients();"
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected union-loading code not found in {filename}')
              path.write_text(text.replace(old, new, 1))

      - name: Verify no first-page-only union loading remains
        shell: python
        run: |
          from pathlib import Path
          for filename in ('app/co/combined.tsx', 'app/co/savings.tsx'):
              text = Path(filename).read_text()
              if 'getClients({limit:100,offset:0})' in text or 'getClients({ limit: 100, offset: 0 })' in text:
                  raise SystemExit(f'First-page-only client loading remains in {filename}')
              if 'getAllClients()' not in text:
                  raise SystemExit(f'getAllClients() is missing in {filename}')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/co/combined.tsx app/co/savings.tsx
          git diff --cached --quiet || git commit -m "fix: load all assigned unions in collection screens"
          git push
