name: Update return adjustment

on:
  push:
    paths:
      - '.github/workflows/update-return-to-use-savings.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch combined collection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/co/combined.tsx')
          s = p.read_text()
          old = "const pct=type==='withdrawal'?Number(settings.buffer_withdrawal||10):Number(settings.buffer_return||10);const amount=Math.round(principal(r)*(pct/100)*100)/100;"
          new = "const pct=type==='withdrawal'?Number(settings.buffer_withdrawal||10):Number(settings.buffer_return||10);const amount=type==='return'?Math.min(Math.max(0,Number(r.savings_balance||0)),Math.max(0,Number(r.loan?.remaining_balance||0))):Math.round(principal(r)*(pct/100)*100)/100;"
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/co/combined.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Use available savings to settle loan on return'
          git push