name: Patch Combined Collection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[combined-disbursed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add disbursed amount to Combined Collection
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/co/combined.tsx')
          s = p.read_text(encoding='utf-8')

          old_calc = "const loanTotal=filtered.reduce((s,r)=>s+Number(r.loan?.remaining_balance||0),0);const savingsTotal=filtered.reduce((s,r)=>s+Number(r.savings_balance||0),0);const totalLoan="
          new_calc = "const loanTotal=filtered.reduce((s,r)=>s+Number(r.loan?.remaining_balance||0),0);const savingsTotal=filtered.reduce((s,r)=>s+Number(r.savings_balance||0),0);const disbursedTotal=filtered.reduce((s,r)=>s+principal(r),0);const totalLoan="
          if old_calc not in s:
              raise SystemExit('Calculation anchor not found')
          s = s.replace(old_calc, new_calc, 1)

          old_ui = '<Summary icon=\"cash-outline\" label=\"LOAN BALANCE\" value={money(loanTotal)} color=\"#7C3AED\" colors={colors}/></View>'
          new_ui = '<Summary icon=\"cash-outline\" label=\"LOAN BALANCE\" value={money(loanTotal)} color=\"#7C3AED\" colors={colors}/><View style={[styles.divider,{backgroundColor:colors.border}]}/><Summary icon=\"trending-up-outline\" label=\"DISBURSED\" value={money(disbursedTotal)} color=\"#2563EB\" colors={colors}/></View>'
          if old_ui not in s:
              raise SystemExit('Summary UI anchor not found')
          s = s.replace(old_ui, new_ui, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/co/combined.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: add disbursed amount to combined collection [combined-disbursed]"
          git push