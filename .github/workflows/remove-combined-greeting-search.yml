name: Remove Combined Greeting and Search UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update combined collection screen
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/co/combined.tsx')
          s = path.read_text(encoding='utf-8')

          s = s.replace("import { useCallback,useEffect,useMemo,useState } from 'react';", "import { useCallback,useEffect,useState } from 'react';")
          s = s.replace("import { LinearGradient } from 'expo-linear-gradient';\n", "")
          s = s.replace("import { getRoleConfig } from '../../src/constants/roles';\n", "")
          s = s.replace("import { loadDashboardStats } from '../../src/services/data';\n", "")

          s = s.replace(" const user=useAuthStore(s=>s.user);const roleCfg=getRoleConfig(user?.role);const colors=useThemeStore(s=>s.colors);", " const user=useAuthStore(s=>s.user);const colors=useThemeStore(s=>s.colors);")
          s = s.replace("const [dashboardStats,setDashboardStats]=useState<any>(null);\n", "")
          s = s.replace("const [query,setQuery]=useState('');\n", "")

          s = s.replace(" const displayName=user?.full_name||user?.name||user?.username||'User';const firstName=displayName.trim().split(/\\s+/)[0]||displayName;const hour=new Date().getHours();const greeting=hour<12?'GOOD MORNING':hour<17?'GOOD AFTERNOON':'GOOD EVENING';\n\n const location={zone:typeof dashboardStats?.zone_name==='string'&&dashboardStats.zone_name.trim()?dashboardStats.zone_name:(typeof user?.zone_name==='string'&&user.zone_name.trim()?user.zone_name:null),area:typeof dashboardStats?.area_name==='string'&&dashboardStats.area_name.trim()?dashboardStats.area_name:(typeof user?.area_name==='string'&&user.area_name.trim()?user.area_name:null),branch:typeof dashboardStats?.branch_name==='string'&&dashboardStats.branch_name.trim()?dashboardStats.branch_name:(typeof user?.branch_name==='string'&&user.branch_name.trim()?user.branch_name:null)};\n", "")

          old = " const loadUnions=useCallback(async()=>{setLoading(true);try{const [r,s]=await Promise.all([api.getClients({limit:100,offset:0}),loadDashboardStats()]);const a=(r.data||[]).filter((c:any)=>String(c.status||'').toLowerCase()==='active');setClients(a);setDashboardStats(s.data||null);const n=Array.from(new Set(a.map((c:any)=>String(c.union||'').trim()||'Unassigned'))).sort((x,y)=>x.localeCompare(y));setUnions(n);setActiveUnion(p=>p&&n.includes(p)?p:(n[0]||''));}catch(e:any){Alert.alert('Unable to load clients',e?.message||'Please try again.')}finally{setLoading(false)}},[]);"
          new = " const loadUnions=useCallback(async()=>{setLoading(true);try{const r=await api.getClients({limit:100,offset:0});const a=(r.data||[]).filter((c:any)=>String(c.status||'').toLowerCase()==='active');setClients(a);const n=Array.from(new Set(a.map((c:any)=>String(c.union||'').trim()||'Unassigned'))).sort((x,y)=>x.localeCompare(y));setUnions(n);setActiveUnion(p=>p&&n.includes(p)?p:(n[0]||''));}catch(e:any){Alert.alert('Unable to load clients',e?.message||'Please try again.')}finally{setLoading(false)}},[]);"
          s = s.replace(old, new)

          s = re.sub(r" const filtered=useMemo\(\(\)=>rows\.filter\(r=>r\.name\.toLowerCase\(\)\.includes\(query\.trim\(\)\.toLowerCase\(\)\)\|\|r\.id\.toLowerCase\(\)\.includes\(query\.trim\(\)\.toLowerCase\(\)\)\),\[rows,query\]\);", " const filtered=rows;", s)
          s = s.replace("setActiveUnion(u);setQuery('')", "setActiveUnion(u)")

          hero = re.compile(r"\n  <LinearGradient colors=\{\[roleCfg\.accent,colors\.gradientEnd\]\}.*?</LinearGradient>", re.S)
          s, n = hero.subn('', s, count=1)
          if n != 1:
              raise SystemExit('Combined greeting hero was not found; refusing to overwrite file')

          search = re.compile(r"<View style=\{\[styles\.toolbar,\{backgroundColor:colors\.card,borderColor:colors\.border\}\]\}>.*?</View></View>", re.S)
          s, n = search.subn('', s, count=1)
          if n != 1:
              raise SystemExit('Client search toolbar was not found; refusing to overwrite file')

          s = s.replace("<Empty icon=\"search-outline\" title=\"No clients found\" text=\"Try another client or union group.\" colors={colors}/>", "<Empty icon=\"people-outline\" title=\"No clients in this union\" text=\"No active clients are available in this union group.\" colors={colors}/>")

          path.write_text(s, encoding='utf-8')

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-combined-greeting-search.yml
          git add app/co/combined.tsx .github/workflows/remove-combined-greeting-search.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Remove combined greeting and client search UI"
          git push
