name: Limit installment on withdrawal

on:
  push:
    paths:
      - '.github/workflows/limit-installment-on-withdrawal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch combined collection rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/co/combined.tsx')
          s = p.read_text()

          old = "const allowedMax=(r:Row)=>Math.max(0,Math.min(2,Number(settings.max_installments_per_payment)||2,remainingInstallments(r)||2));"
          new = "const allowedMax=(r:Row)=>{const e=edits[r.id]||blank();const hasAdjustment=['withdrawal','return'].includes(e.withdrawalType);const cap=hasAdjustment?1:2;return Math.max(0,Math.min(cap,Number(settings.max_installments_per_payment)||2,remainingInstallments(r)||cap));};"
          s = s.replace(old, new)

          old = "const selectAdjustment=(r:Row,type:'withdrawal'|'return')=>{const selectedInstallments=Number(edits[r.id]?.installmentCount)||0;"
          new = "const selectAdjustment=(r:Row,type:'withdrawal'|'return')=>{const selectedInstallments=Number(edits[r.id]?.installmentCount)||0;"
          # Keep the existing guard, but force an existing 2-installment selection back to 1 when adjustment is chosen.
          if old in s:
              s = s.replace(old, new)

          marker = "const autofill=()=>setEdits"
          if marker in s and "withdrawalType:''" in s:
              pass

          # When an adjustment is selected, automatically reduce repayment to one installment.
          target = "setEdits(p=>({...p,[r.id]:{...(p[r.id]||blank()),withdrawalType:type,withdrawal:amount>0?String(amount):''}}))};"
          replacement = "setEdits(p=>{const current=p[r.id]||blank();const next={...current,withdrawalType:type,withdrawal:amount>0?String(amount):''};if(Number(next.installmentCount)>1){next.installmentCount='1';next.installment=String(amountForCount(r,1));}return {...p,[r.id]:next}})};"
          s = s.replace(target, replacement)

          # Ensure saving with a withdrawal/return can never carry more than one installment.
          target = "if(loanCount>=2&&['withdrawal','return'].includes(e.withdrawalType))return Alert.alert('Invalid combination','Withdrawal or Return is not allowed when repaying 2 installments.');"
          replacement = "if(['withdrawal','return'].includes(e.withdrawalType)&&loanCount>1){loanCount=1;}"
          s = s.replace(target, replacement)

          p.write_text(s)
          PY

          if git diff --quiet -- app/co/combined.tsx; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/co/combined.tsx
          git commit -m 'fix: limit withdrawal repayment to one installment'
          git push
